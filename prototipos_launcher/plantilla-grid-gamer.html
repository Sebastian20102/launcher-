<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Gamer - Launcher</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body data-template="grid">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">ML</span>
      <div>
        <strong>Mi Launcher</strong>
        <small>Biblioteca gamer</small>
      </div>
    </div>
    <button class="nav active" data-filter="all">Todos</button>
    <button class="nav" data-filter="favorite">Favoritos</button>
    <button class="nav" data-filter="Juegos">Juegos</button>
    <button class="nav" data-filter="Programas">Programas</button>
    <button class="nav" data-filter="Herramientas">Herramientas</button>
    <div class="sidebar-footer">
      <button class="ghost" data-random>Elegir aleatorio</button>
      <a class="back" href="index.html">Volver</a>
    </div>
  </aside>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Biblioteca</h1>
        <p>Diseño visual para jugar y abrir rápido.</p>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Buscar juego, programa o categoría">
      </div>
    </header>
    <section class="hero-card">
      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1400&q=80" alt="Setup gamer con monitores y luces">
      <div class="hero-copy">
        <span>Último usado</span>
        <h2>Cyberpunk 2077</h2>
        <p>Listo para abrir desde Steam.</p>
        <button class="primary" data-open-featured>Abrir ahora</button>
      </div>
    </section>
    <div class="section-head">
      <h2>Mis accesos</h2>
      <div class="view-actions">
        <button class="chip active" data-sort="recent">Recientes</button>
        <button class="chip" data-sort="name">Nombre</button>
        <button class="chip" data-sort="category">Categoría</button>
      </div>
    </div>
    <section id="library" class="library grid-library"></section>
  </main>
  <dialog id="details" class="details"></dialog>
  <div id="toast" class="toast"></div>
  <script src="shared.js"></script>
</body>
</html>
