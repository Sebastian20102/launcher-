<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus Prototype 02 - Command Palette</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #181a1f;
      --panel-2: #20232a;
      --panel-3: #282c34;
      --line: #343943;
      --text: #f1eee7;
      --muted: #a8abb1;
      --accent: #c8d1dc;
      --gold: #d0bd94;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f1013;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 64px 1fr;
    }
    header {
      display: grid;
      grid-template-columns: 240px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(19,20,24,.96);
    }
    .brand strong { display:block; }
    .brand span { color: var(--muted); font-size: 12px; }
    .cmd-trigger {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #13151a;
      color: var(--muted);
      text-align: left;
      padding: 0 14px;
    }
    .btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 13px;
    }
    .btn.primary { background: var(--gold); color: #101114; border-color: var(--gold); font-weight: 800; }
    .main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 18px;
      padding: 22px;
      min-height: 0;
    }
    .stage, .side {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }
    .stage { padding: 20px; overflow: auto; }
    .hero {
      min-height: 300px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(135deg, #2a2f39, #15171c 62%, #353026);
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      padding: 24px;
      margin-bottom: 18px;
    }
    .hero-copy { align-self: end; }
    .eyebrow { color: var(--gold); font-size: 11px; font-weight: 900; text-transform: uppercase; margin: 0 0 8px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 50px; line-height: 1; margin-bottom: 10px; }
    h2 { font-size: 20px; margin-bottom: 12px; }
    .muted { color: var(--muted); }
    .hero-mark {
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      display: grid;
      place-items: center;
      font-size: 92px;
      font-weight: 900;
      color: rgba(255,255,255,.12);
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .quick {
      min-height: 116px;
      padding: 14px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-2);
      color: var(--text);
    }
    .quick:hover { border-color: var(--accent); background: var(--panel-3); }
    .quick strong { display:block; margin-bottom: 6px; }
    .side { padding: 16px; overflow: auto; }
    .queue-item {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #333943, #15171c);
      display: grid;
      place-items: center;
      color: var(--gold);
      font-weight: 900;
      font-size: 12px;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8,9,11,.72);
      display: none;
      place-items: start center;
      padding-top: 92px;
    }
    .overlay.open { display: grid; }
    .palette {
      width: min(780px, calc(100vw - 44px));
      max-height: 680px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #17191e;
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      padding: 16px;
    }
    .palette input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #111318;
      color: var(--text);
      padding: 0 16px;
      outline: none;
      margin-bottom: 12px;
    }
    .palette input:focus { border-color: var(--accent); }
    .result {
      width: 100%;
      min-height: 58px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 42px 1fr 110px;
      gap: 10px;
      align-items: center;
    }
    .result:hover, .result.active { background: var(--panel-2); border-color: var(--line); }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 12px 14px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><strong>Nexus Command</strong><span>Palette-first launcher</span></div>
      <button class="cmd-trigger" id="openPalette">Ctrl+K  Buscar acceso, carpeta o accion</button>
      <button class="btn primary" id="openSelected">Abrir seleccionado</button>
    </header>
    <section class="main">
      <section class="stage">
        <div class="hero" id="hero"></div>
        <h2>Acciones rapidas</h2>
        <div class="quick-grid" id="quickGrid"></div>
      </section>
      <aside class="side">
        <p class="eyebrow">Cola reciente</p>
        <div id="queue"></div>
      </aside>
    </section>
  </main>

  <div class="overlay" id="overlay">
    <section class="palette">
      <p class="eyebrow">Command palette</p>
      <input id="paletteInput" placeholder="Escribe para buscar. Enter abre. Esc cierra." />
      <div id="results"></div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const items = [
      { name: "Visual Studio Code", category: "Programacion", type: "Editor", status: "Listo", path: "Code.exe" },
      { name: "Proyecto Launcher", category: "Proyectos", type: "Workspace", status: "Activo", path: "NexusLauncherWpf" },
      { name: "Steam", category: "Plataformas", type: "Launcher", status: "Online", path: "steam.exe" },
      { name: "Blender", category: "Diseno", type: "3D", status: "Listo", path: "blender.exe" },
      { name: "OBS Studio", category: "Herramientas", type: "Grabacion", status: "Listo", path: "obs64.exe" },
      { name: "Carpeta Documentos", category: "Carpetas", type: "Folder", status: "Listo", path: "Documents" },
      { name: "Validar rutas", category: "Accion", type: "Command", status: "Sistema", path: "validate" },
      { name: "Importar biblioteca", category: "Accion", type: "Command", status: "Sistema", path: "import" }
    ];
    let selected = items[0];
    let activeIndex = 0;
    const $ = id => document.getElementById(id);

    function initials(name) { return name.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase(); }
    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.add("show");
      setTimeout(() => $("toast").classList.remove("show"), 1700);
    }
    function openItem(item) {
      selected = item;
      render();
      toast(item.category === "Accion" ? `${item.name} ejecutado` : `Abriendo ${item.name}`);
      closePalette();
    }
    function render() {
      $("hero").innerHTML = `<div class="hero-copy">
        <p class="eyebrow">${selected.category}</p>
        <h1>${selected.name}</h1>
        <p class="muted">${selected.type} - ${selected.status} - ${selected.path}</p>
        <div style="margin-top:18px"><button class="btn primary" onclick="openItem(selected)">Abrir ahora</button></div>
      </div><div class="hero-mark">${initials(selected.name)}</div>`;
      $("quickGrid").innerHTML = items.slice(0, 6).map((item, index) => `<button class="quick" data-quick="${index}">
        <span class="eyebrow">${item.category}</span><strong>${item.name}</strong><span class="muted">${item.type} - ${item.status}</span>
      </button>`).join("");
      $("queue").innerHTML = items.slice(0, 7).map((item, index) => `<div class="queue-item">
        <span class="icon">${initials(item.name)}</span>
        <span><strong>${item.name}</strong><br><span class="muted">${item.category}</span></span>
        <button class="btn" data-open="${index}">Abrir</button>
      </div>`).join("");
      document.querySelectorAll("[data-quick]").forEach(btn => btn.onclick = () => { selected = items[Number(btn.dataset.quick)]; render(); });
      document.querySelectorAll("[data-open]").forEach(btn => btn.onclick = () => openItem(items[Number(btn.dataset.open)]));
    }
    function filtered() {
      const q = $("paletteInput").value.trim().toLowerCase();
      return items.filter(item => !q || [item.name, item.category, item.type, item.path].join(" ").toLowerCase().includes(q));
    }
    function renderResults() {
      const list = filtered();
      if (activeIndex >= list.length) activeIndex = 0;
      $("results").innerHTML = list.map((item, index) => `<button class="result ${index === activeIndex ? "active" : ""}" data-result="${index}">
        <span class="icon">${initials(item.name)}</span>
        <span><strong>${item.name}</strong><br><span class="muted">${item.category} - ${item.path}</span></span>
        <span class="muted">${item.status}</span>
      </button>`).join("") || `<p class="muted">Sin resultados.</p>`;
      document.querySelectorAll("[data-result]").forEach(btn => btn.onclick = () => openItem(list[Number(btn.dataset.result)]));
    }
    function openPalette() {
      $("overlay").classList.add("open");
      $("paletteInput").value = "";
      activeIndex = 0;
      renderResults();
      setTimeout(() => $("paletteInput").focus(), 0);
    }
    function closePalette() { $("overlay").classList.remove("open"); }
    $("openPalette").onclick = openPalette;
    $("openSelected").onclick = () => openItem(selected);
    $("paletteInput").addEventListener("input", () => { activeIndex = 0; renderResults(); });
    window.addEventListener("keydown", (event) => {
      if (event.ctrlKey && event.key.toLowerCase() === "k") { event.preventDefault(); openPalette(); }
      if (event.key === "Escape") closePalette();
      if (!$("overlay").classList.contains("open")) return;
      const list = filtered();
      if (event.key === "ArrowDown") { event.preventDefault(); activeIndex = Math.min(activeIndex + 1, Math.max(0, list.length - 1)); renderResults(); }
      if (event.key === "ArrowUp") { event.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); renderResults(); }
      if (event.key === "Enter" && list[activeIndex]) { event.preventDefault(); openItem(list[activeIndex]); }
    });
    render();
  </script>
</body>
</html>
