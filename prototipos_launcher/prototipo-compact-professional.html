<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus Prototype 03 - Compact Professional</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111214;
      --panel: #191b1f;
      --panel-2: #21242a;
      --line: #363a42;
      --text: #efede8;
      --muted: #a9a9aa;
      --accent: #c9cfd7;
      --warm: #c9b88f;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 58px 1fr;
    }
    .toolbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #15171b;
    }
    .brand { font-weight: 900; font-size: 18px; padding-right: 14px; }
    .tabs { display: flex; gap: 8px; }
    .tab, .btn {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      padding: 0 13px;
    }
    .tab.active, .tab:hover, .btn:hover { color: var(--text); background: var(--panel-2); border-color: var(--accent); }
    .btn.primary { background: var(--warm); color: #111214; border-color: var(--warm); font-weight: 800; }
    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      gap: 16px;
      padding: 16px 18px 18px;
    }
    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }
    .left { display: flex; flex-direction: column; }
    .search {
      margin: 14px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #121418;
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .list { overflow: auto; padding: 0 10px 12px; }
    .row {
      width: 100%;
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 54px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 8px;
    }
    .row:hover, .row.active { background: var(--panel-2); border-color: var(--line); }
    .icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #353942, #181b20);
      display: grid;
      place-items: center;
      color: var(--warm);
      font-size: 12px;
      font-weight: 900;
    }
    .row strong, .tile strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .muted { color: var(--muted); font-size: 12px; }
    .center { padding: 16px; overflow: auto; }
    .head { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom: 14px; }
    .eyebrow { color: var(--warm); font-size: 11px; font-weight: 900; text-transform: uppercase; margin: 0 0 6px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 32px; }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }
    .tile {
      min-height: 148px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #15171b;
      color: var(--text);
      text-align: left;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tile:hover { border-color: var(--accent); background: #1d2026; }
    .tile-mark {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--a), #17191d 70%);
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.28);
      font-weight: 900;
    }
    .right { display: grid; grid-template-rows: 190px 1fr auto; }
    .art {
      background: linear-gradient(135deg, var(--a), #17191d 62%, var(--b));
      display: flex;
      align-items: end;
      padding: 18px;
    }
    .art h2 { font-size: 30px; line-height: 1; }
    .info { padding: 16px; overflow: auto; }
    .kv { display:flex; justify-content:space-between; gap:12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .kv span { color: var(--muted); }
    .detail-actions { padding: 16px; display:grid; gap:8px; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      border: 1px solid var(--warm);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px 14px;
      opacity: 0;
      transform: translateY(12px);
      transition: .18s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="brand">Nexus Desk</div>
      <nav class="tabs" id="tabs"></nav>
      <div>
        <button class="btn" id="density">Vista compacta</button>
        <button class="btn primary" id="openBtn">Abrir</button>
      </div>
    </header>
    <section class="layout">
      <aside class="panel left">
        <input id="search" class="search" placeholder="Filtrar biblioteca" />
        <div id="list" class="list"></div>
      </aside>
      <section class="panel center">
        <div class="head">
          <div>
            <p class="eyebrow">Grid operativo</p>
            <h1 id="title">Biblioteca</h1>
          </div>
          <p class="muted" id="count"></p>
        </div>
        <div id="tiles" class="tiles"></div>
      </section>
      <aside class="panel right" id="detail"></aside>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const tabs = ["Todo", "Juegos", "Programacion", "Proyectos", "Herramientas"];
    const items = [
      { name: "Steam", category: "Juegos", type: "Launcher", status: "Online", path: "steam.exe", a: "#343946", b: "#5b6472" },
      { name: "VS Code", category: "Programacion", type: "Editor", status: "Listo", path: "Code.exe", a: "#263241", b: "#596f86" },
      { name: "Nexus WPF", category: "Proyectos", type: "Proyecto", status: "Activo", path: "New project 2", a: "#39342a", b: "#837458" },
      { name: "OBS Studio", category: "Herramientas", type: "Utilidad", status: "Listo", path: "obs64.exe", a: "#2d3332", b: "#667872" },
      { name: "Blender", category: "Herramientas", type: "3D", status: "Listo", path: "blender.exe", a: "#352f2c", b: "#816f60" },
      { name: "Godot", category: "Programacion", type: "Engine", status: "Listo", path: "godot.exe", a: "#293342", b: "#6f8198" },
      { name: "Docs", category: "Proyectos", type: "Carpeta", status: "Listo", path: "Documents", a: "#33343a", b: "#686d78" }
    ];
    let active = "Todo";
    let selected = items[0];
    const $ = id => document.getElementById(id);
    function init(name) { return name.split(" ").map(p => p[0]).join("").slice(0,2).toUpperCase(); }
    function visible() {
      const q = $("search").value.trim().toLowerCase();
      return items.filter(item => (active === "Todo" || item.category === active) && (!q || [item.name,item.category,item.type,item.path].join(" ").toLowerCase().includes(q)));
    }
    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.add("show");
      setTimeout(() => $("toast").classList.remove("show"), 1600);
    }
    function render() {
      const list = visible();
      if (!list.includes(selected) && list[0]) selected = list[0];
      $("tabs").innerHTML = tabs.map(tab => `<button class="tab ${tab === active ? "active" : ""}" data-tab="${tab}">${tab}</button>`).join("");
      $("title").textContent = active === "Todo" ? "Biblioteca" : active;
      $("count").textContent = `${list.length} accesos`;
      $("list").innerHTML = list.map((item, i) => `<button class="row ${selected.name === item.name ? "active" : ""}" data-item="${item.name}">
        <span class="icon">${init(item.name)}</span>
        <span><strong>${item.name}</strong><span class="muted">${item.category} - ${item.type}</span></span>
        <span class="muted">${item.status}</span>
      </button>`).join("");
      $("tiles").innerHTML = list.map(item => `<button class="tile" data-item="${item.name}" style="--a:${item.a}">
        <span class="tile-mark">${init(item.name)}</span>
        <span><strong>${item.name}</strong><span class="muted">${item.category} - ${item.status}</span></span>
      </button>`).join("");
      $("detail").style.setProperty("--a", selected.a);
      $("detail").style.setProperty("--b", selected.b);
      $("detail").innerHTML = `<div class="art"><h2>${selected.name}</h2></div>
        <div class="info">
          <p class="eyebrow">Detalle</p>
          <div class="kv"><span>Categoria</span><strong>${selected.category}</strong></div>
          <div class="kv"><span>Tipo</span><strong>${selected.type}</strong></div>
          <div class="kv"><span>Estado</span><strong>${selected.status}</strong></div>
          <div class="kv"><span>Ruta</span><strong>${selected.path}</strong></div>
        </div>
        <div class="detail-actions">
          <button class="btn primary" onclick="toast('Abriendo ${selected.name}')">Abrir</button>
          <button class="btn">Abrir ubicacion</button>
          <button class="btn">Editar</button>
        </div>`;
      document.querySelectorAll("[data-tab]").forEach(btn => btn.onclick = () => { active = btn.dataset.tab; render(); });
      document.querySelectorAll("[data-item]").forEach(btn => btn.onclick = () => { selected = items.find(item => item.name === btn.dataset.item); render(); });
    }
    $("search").addEventListener("input", render);
    $("openBtn").onclick = () => toast(`Abriendo ${selected.name}`);
    $("density").onclick = () => {
      document.body.classList.toggle("dense");
      toast("Densidad alternada");
    };
    render();
  </script>
</body>
</html>
