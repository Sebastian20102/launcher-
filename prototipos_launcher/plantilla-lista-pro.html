<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista Pro - Launcher</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body data-template="list">
  <aside class="sidebar slim">
    <div class="brand">
      <span class="mark green">LP</span>
      <div>
        <strong>Lista Pro</strong>
        <small>Rápido y ordenado</small>
      </div>
    </div>
    <button class="nav active" data-filter="all">Todos</button>
    <button class="nav" data-filter="favorite">Favoritos</button>
    <button class="nav" data-filter="Juegos">Juegos</button>
    <button class="nav" data-filter="Programas">Programas</button>
    <button class="nav" data-filter="Herramientas">Herramientas</button>
    <div class="sidebar-footer">
      <button class="ghost" data-density>Compactar</button>
      <a class="back" href="index.html">Volver</a>
    </div>
  </aside>
  <main class="shell list-shell">
    <header class="topbar">
      <div>
        <h1>Todos los programas</h1>
        <p>Diseño para bibliotecas grandes.</p>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Buscar por nombre, ruta o tipo">
      </div>
    </header>
    <div class="table-toolbar">
      <button class="chip active" data-sort="name">A-Z</button>
      <button class="chip" data-sort="recent">Recientes</button>
      <button class="chip" data-sort="category">Categoría</button>
      <button class="chip" data-sort="status">Estado</button>
    </div>
    <section id="library" class="library table-list"></section>
  </main>
  <dialog id="details" class="details"></dialog>
  <div id="toast" class="toast"></div>
  <script src="shared.js"></script>
</body>
</html>
